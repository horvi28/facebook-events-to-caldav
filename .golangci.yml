version: "2"

linters:
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errorlint
    - errname
    - exptostd
    - funcorder
    - funlen
    - gocognit
    - goconst
    - gocritic
    - govet
    - iface
    - ineffassign
    - interfacebloat
    - intrange
    - importas
    - maintidx
    - misspell
    - modernize
    - musttag
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - perfsprint
    - prealloc
    - predeclared
    - revive
    - sloglint
    - staticcheck
    - tagalign
    - tagliatelle
    - thelper
    - unconvert
    - unparam
    - unused
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck

  settings:
    cyclop:
      max-complexity: 12
    goconst:
      # Repeated literals in tests are fixtures and assertions stating the same
      # value independently. Extracting them does not make any sense, so tests
      # are left out of the analysis.
      ignore-tests: true
    tagalign:
      sort: true
      strict: true
