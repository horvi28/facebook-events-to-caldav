version: "2"

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exptostd
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - godoclint
    - gosec
    - govet
    - iface
    - importas
    - ineffassign
    - interfacebloat
    - intrange
    - lll
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - sloglint
    - staticcheck
    - tagalign
    - tagliatelle
    - thelper
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck

  settings:
    cyclop:
      max-complexity: 12
    goconst:
      # Repeated literals in tests are fixtures and assertions stating the same
      # value independently. Extracting them does not make any sense, so tests
      # are left out of the analysis.
      ignore-tests: true
    gosec:
      # The created files are read by hand, so they have to stay
      # readable outside the process that wrote them
      config:
        G306: "0644"
      # The file paths come from CLI flags and the random sleeps are jitter,
      # not a security decision.
      excludes:
        - G304
        - G404
    lll:
      # Long enough to leave the aligned struct tags alone, short enough to
      # catch a parameter list that no longer fits on a screen
      line-length: 140
    tagalign:
      sort: true
      strict: true
    tagliatelle:
      # snake_case is the usual style for YAML keys, and the config files are
      # written by hand, so they should read naturally
      case:
        rules:
          yaml: snake

  exclusions:
    rules:
      # A table driven test is long because of its table, not because of its
      # logic. Splitting one up to satisfy a line count would only make it
      # harder to read.
      - path: _test\.go
        linters:
          - funlen
