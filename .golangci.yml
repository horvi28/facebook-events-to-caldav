version: "2"

linters:
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errorlint
    - funlen
    - gocognit
    - goconst
    - gocritic
    - govet
    - iface
    - ineffassign
    - importas
    - maintidx
    - misspell
    - modernize
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - tagalign
    - tagliatelle
    - unconvert
    - unparam
    - unused
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck

  settings:
    cyclop:
      max-complexity: 12
    tagalign:
      sort: true
      strict: true