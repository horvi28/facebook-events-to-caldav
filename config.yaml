# Pacing of the scraper. Every value is required, there are no defaults in the
# code, so the scraper refuses to start if a key is missing.
#
# Every pause is a random wait somewhere between its minimum and its maximum, so
# the maximum has to be greater than the minimum. Durations are written with
# their unit: 5s, 10m, 1h.
#
# Lowering these makes a run finish sooner at the price of looking more like a
# bot to Facebook.
scrape:
  # Wait between fetching the details of two events of the same host
  pause_between_events:
    min: 5s
    max: 20s

  # Wait between two hosts
  pause_between_hosts:
    min: 10s
    max: 30s

  # A longer break after every so many hosts, to break up the run
  long_pause_after_hosts: 10
  long_pause:
    min: 10m
    max: 20m

  # Wait after a host failed, before moving on to the next one. Long, as a
  # failure is the point where Facebook is most likely to have noticed something
  pause_after_failure:
    min: 1h
    max: 2h

  # Give up the whole run once more than this many hosts have failed
  max_failed_hosts: 5

  # How many hosts a single run scrapes. The most overdue ones are picked, the
  # rest follow on the next runs, so all of them are covered eventually. Set it
  # to the number of hosts or a really big number to scrape everything in one go.
  hosts_per_run: 20

# The background mode, see --daemon. A cycle scrapes hosts_per_run hosts and
# then the daemon waits for the next one.
daemon:
  # Wait this amount between two scrape cycles
  interval: 24h
