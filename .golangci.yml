version: "2"

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - revive
    - bodyclose
    - copyloopvar
    - durationcheck
    - gocritic
    - misspell
    - unconvert
    - prealloc
    - varnamelen
    - funlen
    - dupl
    - gocognit
    - cyclop
    - maintidx
    - errorlint
    - wrapcheck
    - noctx
    - nilnil

  settings:
    cyclop:
      max-complexity: 12